services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: algoworld
      POSTGRES_USER: algoworld
      POSTGRES_PASSWORD: algoworld_local
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoworld -d algoworld"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: